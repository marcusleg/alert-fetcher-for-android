# Alertmanager for local testing. Alerts are injected with ../scripts/send-demo-alerts.py.
route:
  receiver: default
  group_by: [alertname]
  routes:
    # What a real setup might route to the phone (see "Only receivers" in the app).
    - receiver: phone
      matchers: ['severity=~"critical|warning"']
      continue: true

receivers:
  - name: default
  - name: phone
